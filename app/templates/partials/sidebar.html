<aside class="navbar navbar-vertical navbar-expand-lg app-sidebar" data-bs-theme="dark">
  <div class="container-fluid h-100">
    <div class="sidebar-brand-wrap">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Menüyü aç/kapat">
        <i class="ti ti-menu-2"></i>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark">
        <a href="{{ url_for('index') }}" class="text-decoration-none">
          <span class="brand-mark">B</span>
          <span class="brand-copy"><strong>BAYLAN STOK</strong><small>IT ASSET MANAGEMENT</small></span>
        </a>
      </h1>
    </div>
    <div class="collapse navbar-collapse" id="sidebar-menu">
      <div class="navbar-nav sidebar-nav pt-0 w-100">
        {% for section in sidebar_sections %}
        <div class="nav-item nav-item-section">{{ section.title }}</div>
        {% for item in section.nav_items %}
        <a class="nav-link {{ 'active' if item.key == active_page else '' }}" href="{{ url_for(item.endpoint) }}">
          <span class="nav-link-icon"><i class="ti {{ item.icon | replace('bi ', '') | replace('bi-', 'ti-') }}"></i></span>
          <span class="nav-link-title">{{ item.title }}</span>
        </a>
        {% endfor %}
        {% endfor %}
      </div>
    </div>
    <div class="sidebar-footer d-none d-lg-block">
      <div class="sidebar-footer-title">STOK YÖNETİM</div>
      <div class="sidebar-footer-version">v1.0.0</div>
    </div>
  </div>
</aside>
