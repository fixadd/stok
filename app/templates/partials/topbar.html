<header class="navbar navbar-expand-md d-none d-lg-flex d-print-none">
  <div class="container-xl">
    <div class="navbar-nav flex-row order-md-last ms-auto align-items-center">
      {% if active_user %}
      <div class="nav-item dropdown">
        <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown" aria-label="Kullanıcı menüsü">
          <span class="avatar avatar-sm">{{ (active_user.first_name or 'K')[:1] }}{{ (active_user.last_name or '')[:1] }}</span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ active_user.first_name }} {{ active_user.last_name }}</div>
            <div class="mt-1 small text-secondary">{{ system_role_labels.get(active_system_role, 'Kullanıcı') }}</div>
          </div>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
          <a class="dropdown-item" href="{{ url_for('profile') }}"><i class="ti ti-user me-2"></i>Profil</a>
          <div class="dropdown-divider"></div>
          <form method="post" action="{{ url_for('logout') }}" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="dropdown-item" type="submit"><i class="ti ti-logout me-2"></i>Çıkış Yap</button>
          </form>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</header>
