<div class="modal fade" id="repairFormModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><form class="modal-content shadow-lg" id="repairForm"><div class="modal-header border-0"><div><h5 class="modal-title" id="repairFormTitle">Yeni Tamir / Servis Kaydı</h5><p class="text-muted mb-0">Arıza kaydı ve dış servis sürecini takip edin.</p></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" name="repair_id"><div class="row g-3"><div class="col-md-6"><label class="form-label">Envanter</label><select class="form-select" name="item_id" required><option value="">Envanter seçin</option>{% for item in repair_inventory_options %}<option value="{{ item.id }}">{{ item.label }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Arıza Tarihi</label><input class="form-control" name="fault_date" type="datetime-local" required></div><div class="col-md-3"><label class="form-label">Arıza Türü</label><input class="form-control" name="fault_type" maxlength="128" placeholder="Donanım / Yazılım / Diğer"></div><div class="col-12"><label class="form-label">Arıza / Sorun Açıklaması</label><textarea class="form-control" name="problem_description" rows="3" maxlength="5000" required></textarea></div><div class="col-md-3"><label class="form-label">Durum</label><select class="form-select" name="status">{% for key,label in repair_statuses.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-3 d-flex align-items-end"><div class="form-check form-switch pb-2"><input class="form-check-input" type="checkbox" name="sent_to_service" value="true" id="sentToService"><label class="form-check-label" for="sentToService">Dış servise gönderildi</label></div></div><div class="col-md-6"><label class="form-label">Servis Firması</label><input class="form-control" name="service_company" maxlength="256"></div><div class="col-md-4"><label class="form-label">Servis Yetkilisi / İletişim</label><input class="form-control" name="service_contact" maxlength="128"></div><div class="col-md-4"><label class="form-label">Servis Kayıt No</label><input class="form-control" name="service_ticket_no" maxlength="128"></div><div class="col-md-4"><label class="form-label">Garanti</label><select class="form-select" name="warranty_status">{% for key,label in warranty_statuses.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Gönderim Tarihi</label><input class="form-control" name="sent_at" type="datetime-local"></div><div class="col-md-4"><label class="form-label">Tahmini Dönüş</label><input class="form-control" name="expected_return_at" type="datetime-local"></div><div class="col-md-4"><label class="form-label">Gerçek Dönüş</label><input class="form-control" name="returned_at" type="datetime-local"></div><div class="col-md-6"><label class="form-label">Yapılan Tamir</label><textarea class="form-control" name="repair_description" rows="3" maxlength="5000"></textarea></div><div class="col-md-3"><label class="form-label">Servis Ücreti</label><input class="form-control" name="service_cost" type="number" min="0" step="0.01"></div><div class="col-md-3"><label class="form-label">Not</label><textarea class="form-control" name="note" rows="3" maxlength="2000"></textarea></div></div><div class="alert d-none mt-3 mb-0" id="repairFeedback"></div></div><div class="modal-footer border-0"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Vazgeç</button><button class="btn btn-primary" type="submit">Kaydet</button></div></form></div></div>
