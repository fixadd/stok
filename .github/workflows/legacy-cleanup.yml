name: One-time legacy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!startsWith(github.event.head_commit.message, 'refactor: remove runtime schema and seed mutations')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove runtime schema and seed mutations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/legacy.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          startup_index = None
          for i in range(2, len(lines)):
              if (
                  "db.create_all()" in lines[i]
                  and "seed_initial_data()" in lines[i + 1]
                  and "with app.app_context()" in lines[i - 1]
              ):
                  startup_index = i - 1
                  break
          if startup_index is None:
              raise SystemExit("startup schema/seed block not found")

          newline = "\n"
          if lines[startup_index].endswith("\r\n"):
              newline = "\r\n"
          lines[startup_index:startup_index + 3] = [
              f"    # Database schema is managed exclusively by Alembic migrations.{newline}",
              f"    # Initial/demo data is intentionally not seeded during application startup.{newline}",
          ]
          text = "".join(lines)

          start_marker = '    @app.post("/admin-panel/data/reset")'
          start = next((i for i, line in enumerate(lines) if line.startswith(start_marker)), None)
          if start is None:
              raise SystemExit("reset route not found")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("    @app.")), None)
          if end is None:
              raise SystemExit("next route after reset not found")

          reset_lines = [
              f'    @app.post("/admin-panel/data/reset"){newline}',
              f"    def reset_database_view():{newline}",
              f"        user = get_active_user(){newline}",
              f'        if not has_system_role(user, "superadmin"):{newline}',
              f'            flash("Veritabanı işlemleri için süper admin yetkisi gerekir.", "danger"){newline}',
              f'            return redirect(url_for("admin_panel", section="data-section")){newline}',
              newline,
              f"        flash({newline}",
              f'            "Veritabanı şeması uygulama üzerinden sıfırlanamaz. Alembic migration ve PostgreSQL backup/restore işlemlerini kullanın.",{newline}',
              f'            "warning",{newline}',
              f"        ){newline}",
              f'        return redirect(url_for("admin_panel", section="data-section")){newline}',
          ]
          lines[start:end] = reset_lines
          path.write_text("".join(lines), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/legacy.py .github/workflows/legacy-cleanup.yml
          git commit -m "refactor: remove runtime schema and seed mutations"
          git push
