name: One-time metadata cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!startsWith(github.event.head_commit.message, 'refactor: remove hard-coded stock metadata')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hard-coded stock metadata
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("app/legacy.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text, filename=str(path))

          target = None
          for node in tree.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == "STOCK_METADATA_FIELDS":
                  target = node
                  break
          if target is None or target.end_lineno is None:
              raise SystemExit("STOCK_METADATA_FIELDS assignment not found")

          newline = "\r\n" if "\r\n" in text else "\n"
          replacement = f'STOCK_METADATA_FIELDS: dict[str, list[dict[str, Any]]] = {{{newline}}}'
          lines[target.lineno - 1:target.end_lineno] = [replacement]
          path.write_text("".join(lines), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/legacy.py .github/workflows/metadata-cleanup.yml
          git commit -m "refactor: remove hard-coded stock metadata"
          git push
