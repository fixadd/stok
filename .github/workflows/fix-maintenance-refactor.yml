name: Fix Maintenance Refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('app/legacy.py')
          s = p.read_text(encoding='utf-8')
          old = 'last_maintenance = item.maintenances[0] if item.maintenances else None'
          new = 'last_maintenance = max(item.maintenances, key=lambda record: record.performed_at) if item.maintenances else None'
          if old not in s:
              raise SystemExit('Expected maintenance expression not found; aborting safely.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('app/services/demo_seed.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('def __resolve_stock_category(', 'def _resolve_stock_category(')
          s = s.replace('def __resolve_stock_unit(', 'def _resolve_stock_unit(')
          s = s.replace('__resolve_stock_category(', '_resolve_stock_category(')
          s = s.replace('__resolve_stock_unit(', '_resolve_stock_unit(')
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-maintenance-refactor.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','fix: use latest maintenance record in dashboard'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
