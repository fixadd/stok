name: Split Models Safe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split model definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, subprocess

          source_path = Path('app/models.py')
          source = source_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)

          groups = {
              'users': {'User'},
              'inventory': {'Factory','HardwareType','Brand','HardwareModel','InventoryItem','InventoryEvent','InventoryLicense','InventoryAssignment'},
              'maintenance': {'InventoryMaintenance','RepairRecord','RepairQA','RepairSLA'},
              'requests': {'RequestGroup','RequestOrder','RequestLine','RequestLineSnapshot'},
              'stock': {'StockCategory','StockUnit','StockItem','StockLog','StockMovement','StockAssignment','StockAuditLog'},
              'licenses': {'LicenseName'},
              'information': {'InfoCategory','InfoEntry','InfoAttachment'},
              'catalog': {'UsageArea','ProductCatalogEntry'},
              'activity': {'ActivityLog'},
          }
          known = {name for names in groups.values() for name in names}
          class_nodes = [n for n in tree.body if isinstance(n, ast.ClassDef)]
          class_names = {n.name for n in class_nodes}
          missing = known - class_names
          if missing:
              # Only fail for mappings that are actually expected in this version.
              missing = {name for name in missing if name in {'User','InventoryItem','StockItem','ActivityLog'}}
              if missing:
                  raise SystemExit(f'Missing expected model classes: {sorted(missing)}')

          import_nodes = [n for n in tree.body if isinstance(n, (ast.Import, ast.ImportFrom))]
          import_lines = [ast.get_source_segment(source, n) for n in import_nodes]
          imports = '\n'.join(x for x in import_lines if x) + '\n\n'

          base = '''from __future__ import annotations\n\nfrom datetime import date, datetime\n\nfrom flask_sqlalchemy import SQLAlchemy\n\ndb = SQLAlchemy()\n\n\nclass NamedEntityMixin:\n    id = db.Column(db.Integer, primary_key=True)\n    name = db.Column(db.String(128), unique=True, nullable=False)\n\n    def to_dict(self) -> dict:\n        return {"id": self.id, "name": self.name}\n\n'''
          model_dir = Path('app/model_domains')
          model_dir.mkdir(parents=True, exist_ok=True)
          (model_dir / '__init__.py').write_text('', encoding='utf-8')
          (model_dir / 'base.py').write_text(base, encoding='utf-8')

          for filename, names in groups.items():
              selected = [n for n in class_nodes if n.name in names]
              if not selected:
                  continue
              body = ''.join(''.join(lines[n.lineno-1:n.end_lineno]) + '\n\n' for n in selected)
              header = imports.replace('from flask_sqlalchemy import SQLAlchemy\n', '').replace('db = SQLAlchemy()\n\n', '')
              header += 'from .base import db, NamedEntityMixin\n\n'
              (model_dir / f'{filename}.py').write_text(header + body, encoding='utf-8')

          # Preserve non-class helpers (if any) in a compatibility module.
          helpers = [n for n in tree.body if isinstance(n, ast.FunctionDef)]
          if helpers:
              body = ''.join(''.join(lines[n.lineno-1:n.end_lineno]) + '\n\n' for n in helpers)
              header = imports.replace('from flask_sqlalchemy import SQLAlchemy\n', '')
              header += 'from .base import db\n\n'
              (model_dir / 'common.py').write_text(header + body, encoding='utf-8')

          # Import every domain module once so SQLAlchemy sees the complete registry.
          exports = [
              'from .base import db, NamedEntityMixin',
              'from .users import *',
              'from .inventory import *',
              'from .maintenance import *',
              'from .requests import *',
              'from .stock import *',
              'from .licenses import *',
              'from .information import *',
              'from .catalog import *',
              'from .activity import *',
          ]
          if (model_dir / 'common.py').exists():
              exports.append('from .common import *')
          (model_dir / '__init__.py').write_text('\n'.join(exports) + '\n', encoding='utf-8')

          compatibility = '''"""Compatibility import surface for the domain model modules."""\n\nfrom .model_domains import *  # noqa: F401,F403\n\n'''
          source_path.write_text(compatibility, encoding='utf-8')

          Path('.github/workflows/split-models-safe.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','refactor: split SQLAlchemy models by domain'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
