name: Split Modals Safe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split modal markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          targets = [
              'app/templates/inventory_tracking.html',
              'app/templates/talep_takip.html',
              'app/templates/stock_tracking.html',
              'app/templates/admin_panel.html',
              'app/templates/license_tracking.html',
              'app/templates/maintenance_tracking.html',
          ]

          def block_end(text, start):
              pos = start
              depth = 0
              while True:
                  open_pos = text.find('<div', pos)
                  close_pos = text.find('</div>', pos)
                  if close_pos == -1:
                      return None
                  if open_pos != -1 and open_pos < close_pos:
                      depth += 1
                      pos = open_pos + 4
                  else:
                      depth -= 1
                      pos = close_pos + 6
                      if depth == 0:
                          return pos

          changed = False
          for filename in targets:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              starts = []
              cursor = 0
              while True:
                  idx = text.find('<div class="modal', cursor)
                  if idx == -1:
                      break
                  starts.append(idx)
                  cursor = idx + 5
              if not starts:
                  continue

              partial_dir = path.parent / f'{path.stem}_partials'
              partial_dir.mkdir(parents=True, exist_ok=True)
              replacements = []
              for idx, start in enumerate(starts, 1):
                  end = block_end(text, start)
                  if end is None:
                      raise SystemExit(f'Unbalanced modal markup: {filename}')
                  if replacements and start < replacements[-1][1]:
                      continue
                  partial = partial_dir / f'modal_{idx}.html'
                  partial.write_text(text[start:end].strip() + '\n', encoding='utf-8')
                  replacements.append((start, end, "{% include '" + path.stem + "_partials/" + partial.name + "' %}"))
              for start, end, replacement in reversed(replacements):
                  text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')
              changed = True

          if not changed:
              raise SystemExit('No modal markup found; nothing changed.')

          Path('.github/workflows/split-modals-safe.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','refactor: split modal markup into partials'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
