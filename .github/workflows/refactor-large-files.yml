name: Refactor large files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'fixadd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract safe inline scripts and clean legacy classes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          templates = [
              'app/templates/inventory_tracking.html',
              'app/templates/talep_takip.html',
              'app/templates/stock_tracking.html',
              'app/templates/admin_panel.html',
              'app/templates/license_tracking.html',
          ]
          js_dir = root / 'app/static/js/pages'
          js_dir.mkdir(parents=True, exist_ok=True)

          changed = False
          for rel in templates:
              path = root / rel
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(' shadow-sm', '').replace('shadow-sm ', '')
              counter = [0]

              def replace_script(match):
                  body = match.group(1)
                  if '{%' in body or '{{' in body:
                      return match.group(0)
                  if not body.strip():
                      return ''
                  counter[0] += 1
                  stem = path.stem
                  target = js_dir / f'{stem}-{counter[0]}.js'
                  if target.exists():
                      existing = target.read_text(encoding='utf-8')
                      if existing != body.strip() + '\\n':
                          raise SystemExit(f'Refusing to overwrite changed JS file: {target}')
                  else:
                      target.write_text(body.strip() + '\\n', encoding='utf-8')
                  return f'<script src="{{{{ url_for(\'static\', filename=\'js/pages/{target.name}\') }}}}"></script>'

              text = re.sub(r'<script(?:\s[^>]*)?>(.*?)</script>', replace_script, text, flags=re.I | re.S)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          css = root / 'app/static/css/redesign.css'
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Error pages */'
          if marker not in css_text:
              css_text += '''\n\n/* Error pages */\n.error-page { min-height:60vh; display:grid; place-items:center; padding:32px 0; }\n.error-card { width:min(620px,100%); padding:40px; text-align:center; background:#fff; border:1px solid var(--app-border); border-radius:10px; box-shadow:var(--app-shadow); }\n.error-code { margin:0; color:#171717; font-size:72px; line-height:1; font-weight:700; letter-spacing:-.06em; }\n.error-card h1 { margin:16px 0 8px; color:#171717; font-size:20px; font-weight:650; }\n.error-card p { margin:0 auto 22px; max-width:480px; color:#737373; font-size:13px; }\n@media (max-width:640px) { .error-card { padding:28px 20px; } .error-code { font-size:56px; } }\n'''
              css.write_text(css_text, encoding='utf-8')
              changed = True

          audit = root / 'docs/LARGE_FILE_AUDIT.md'
          rows = []
          for path in sorted((root / 'app').rglob('*')):
              if not path.is_file():
                  continue
              size = path.stat().st_size
              if size >= 16000:
                  with path.open(encoding='utf-8', errors='ignore') as handle:
                      count = sum(1 for _ in handle)
                  rows.append((size, count, path.relative_to(root)))
          rows.sort(reverse=True)
          lines = ['# Büyük Dosya Denetimi', '', 'Generated from the current `main` tree. Files are prioritized by size and responsibility, not size alone.', '', '| Boyut | Satır | Dosya | Öneri |', '|---:|---:|---|---|']
          for size, count, path in rows:
              if str(path).endswith('legacy.py'):
                  rec = 'Domain servisleri, query katmanı ve seed/demo koduna ayır.'
              elif '/templates/' in str(path):
                  rec = 'Partial + modal + page-specific JS/CSS olarak ayır.'
              elif str(path).endswith('style.css'):
                  rec = 'Kullanılan ortak/component kurallarını ayır; eski tema kurallarını kaldır.'
              elif str(path).endswith('models.py'):
                  rec = 'Domain model modüllerine ayır; ortak db/base tek yerde kalsın.'
              else:
                  rec = 'Fonksiyon sorumluluklarına göre böl; sırf boyut için bölme.'
              lines.append(f'| {size/1024:.1f} KB | {count} | `{path}` | {rec} |')
          lines += ['', '## Kural', '', 'Yeni kod büyük monolitik dosyalara eklenmemeli. Refactor adımları küçük commitler halinde yapılmalı ve her adım PostgreSQL CI ile doğrulanmalı.']
          audit.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          changed = True

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'app/templates', 'app/static/js/pages', 'app/static/css/redesign.css', 'docs/LARGE_FILE_AUDIT.md'], check=True)
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
                  subprocess.run(['git', 'commit', '-m', 'refactor: extract safe page scripts and finish theme cleanup'], check=True)
                  subprocess.run(['git', 'push'], check=True)
          PY
