name: Split Template Modals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract modal partials
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          targets = [
              'app/templates/inventory_tracking.html',
              'app/templates/talep_takip.html',
              'app/templates/stock_tracking.html',
              'app/templates/admin_panel.html',
              'app/templates/license_tracking.html',
              'app/templates/maintenance_tracking.html',
          ]

          def find_block(text, start):
              open_pat = re.compile(r'<div\\b[^>]*>')
              close_pat = re.compile(r'</div\\s*>', re.I)
              pos = start
              depth = 0
              while pos < len(text):
                  om = open_pat.search(text, pos)
                  cm = close_pat.search(text, pos)
                  if not cm:
                      return None
                  if om and om.start() < cm.start():
                      depth += 1
                      pos = om.end()
                  else:
                      depth -= 1
                      pos = cm.end()
                      if depth == 0:
                          return (start, pos)
              return None

          changed = False
          for filename in targets:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              starts = list(re.finditer(r'<div\\b[^>]*class=["\'][^"\']*\\bmodal\\b[^"\']*["\'][^>]*>', text, re.I))
              if not starts:
                  continue
              replacements = []
              partial_dir = path.parent / (path.stem + '_partials')
              partial_dir.mkdir(parents=True, exist_ok=True)
              for idx, match in enumerate(starts, 1):
                  block = find_block(text, match.start())
                  if not block:
                      raise SystemExit(f'Could not balance modal in {filename}')
                  start, end = block
                  # Avoid overlapping matches after a nested modal-like div.
                  if replacements and start < replacements[-1][1]:
                      continue
                  content = text[start:end]
                  partial = partial_dir / f'modal_{idx}.html'
                  partial.write_text(content.strip() + '\n', encoding='utf-8')
                  replacements.append((start, end, "{% include '" + path.stem + "_partials/" + partial.name + "' %}"))
              if not replacements:
                  continue
              for start, end, repl in reversed(replacements):
                  text = text[:start] + repl + text[end:]
              path.write_text(text, encoding='utf-8')
              changed = True

          if not changed:
              raise SystemExit('No modal blocks found; aborting safely.')

          Path('.github/workflows/split-template-modals.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','refactor: split large template modals'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
