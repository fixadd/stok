name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stok_ci
          POSTGRES_USER: stok
          POSTGRES_PASSWORD: stok_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stok -d stok_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app migrations tests

      - name: Validate Alembic heads
        env:
          DATABASE_URL: postgresql+psycopg://stok:stok_ci_password@127.0.0.1:5432/stok_ci
        run: python -m alembic heads

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://stok:stok_ci_password@127.0.0.1:5432/stok_ci
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t stok-web:ci .
