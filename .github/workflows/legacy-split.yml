name: Legacy Split

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Extract helpers and demo seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import subprocess

          legacy_path = Path('app/legacy.py')
          source = legacy_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)

          helper_names = {
              'record_activity', 'serialize_activity_log', 'load_activity_logs',
              'load_recent_activity', 'format_datetime_display',
              'serialize_maintenance_record', 'calculate_maintenance_status',
              'maintenance_status_badge_class', 'maintenance_row_class',
              'record_stock_movement', 'record_stock_audit', 'record_stock_log',
          }
          seed_names = {
              'seed_initial_data', 'seed_simple_users', 'seed_product_metadata',
              'seed_information_entries', 'seed_inventory_data', 'seed_ldap_profiles',
              'seed_request_data', 'seed_stock_reference_data', 'seed_stock_data',
          }

          def get_source(node):
              return ''.join(lines[node.lineno - 1:node.end_lineno])

          helper_nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in helper_names]
          seed_nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in seed_names]

          if not helper_nodes or not seed_nodes:
              raise SystemExit('Expected helper/seed functions were not found; aborting safely.')

          helper_import = '''\nfrom .services.activity_service import (\n    DEFAULT_EVENT_ACTOR,\n    load_activity_logs,\n    load_recent_activity,\n    record_activity,\n    serialize_activity_log,\n)\nfrom .services.maintenance_helpers import (\n    MAINTENANCE_INTERVAL_DAYS,\n    calculate_maintenance_status,\n    format_datetime_display,\n    maintenance_row_class,\n    maintenance_status_badge_class,\n    serialize_maintenance_record,\n)\nfrom .services.stock_audit_service import (\n    record_stock_audit,\n    record_stock_log,\n    record_stock_movement,\n)\n'''

          marker = 'from .services.authz import ('
          insert_at = source.index(marker)
          # Put service imports before authz, after the local imports block.
          source = source[:insert_at] + helper_import + '\n' + source[insert_at:]
          # Recompute AST/lines after import insertion for safe removal.
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          remove_names = helper_names | seed_names
          ranges = []
          for n in tree.body:
              if isinstance(n, ast.FunctionDef) and n.name in remove_names:
                  ranges.append((n.lineno - 1, n.end_lineno))
          for start, end in sorted(ranges, reverse=True):
              del lines[start:end]
          source = ''.join(lines)
          legacy_path.write_text(source, encoding='utf-8')

          seed_sources = [get_source(n) for n in seed_nodes]
          seed_module = '''from __future__ import annotations\n\nfrom datetime import datetime, timedelta\nfrom typing import Any\n\nfrom werkzeug.security import generate_password_hash\nfrom sqlalchemy import func\nfrom sqlalchemy.orm import joinedload\n\nfrom ..models import (\n    Brand, Factory, HardwareModel, HardwareType, InfoCategory, InfoEntry,\n    InventoryEvent, InventoryItem, InventoryLicense, LdapProfile, LicenseName,\n    RequestGroup, RequestLine, RequestOrder, StockCategory, StockItem, StockUnit,\n    UsageArea, User, db, find_existing_by_name,\n)\nfrom .activity_service import record_activity\nfrom .stock_audit_service import record_stock_log\n\nSTOCK_CATEGORY_LABELS = {\n    'envanter': 'Envanter',\n    'cevre_birimi': 'Çevre Birimi',\n    'yazici': 'IP Yazıcı',\n    'lisans': 'Lisans',\n    'talep': 'Talep',\n    'manuel': 'Manuel',\n}\n\ndef _resolve_stock_category(name: str):\n    existing = find_existing_by_name(StockCategory, name)\n    if existing:\n        return existing\n    category = StockCategory(name=name)\n    db.session.add(category)\n    db.session.flush()\n    return category\n\ndef _resolve_stock_unit(name: str):\n    existing = find_existing_by_name(StockUnit, name)\n    if existing:\n        return existing\n    unit = StockUnit(name=name)\n    db.session.add(unit)\n    db.session.flush()\n    return unit\n\n'''
          seed_module += '\n\n'.join(seed_sources) + '\n'
          Path('app/services/demo_seed.py').write_text(seed_module, encoding='utf-8')

          # Replace seed helper calls inside the extracted module with local helpers.
          p = Path('app/services/demo_seed.py')
          s = p.read_text(encoding='utf-8').replace('resolve_stock_category(', '_resolve_stock_category(').replace('resolve_stock_unit(', '_resolve_stock_unit(')
          p.write_text(s, encoding='utf-8')

          # Keep the historical import surface for tests/tools without keeping seed logic in legacy.py.
          with legacy_path.open('a', encoding='utf-8') as f:
              f.write('\nfrom .services.demo_seed import seed_initial_data\n')

          # Remove this temporary workflow before committing the refactor.
          wf = Path('.github/workflows/legacy-split.yml')
          wf.unlink()

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              raise SystemExit('No changes produced.')
          subprocess.run(['git', 'commit', '-m', 'refactor: extract legacy helpers and demo seed'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY
