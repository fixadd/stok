name: Patch smoke tests
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'fixadd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tests and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_smoke_routes.py')
          s = p.read_text()
          s = s.replace('''from app.models import (\n    HardwareType,''', '''from app.models import (\n    Brand,\n    Factory,\n    HardwareModel,\n    HardwareType,''')
          s = s.replace('''    def login_as(self, user_id):\n        with self.client.session_transaction() as session:\n            session["active_user_id"] = user_id\n''', '''    def login_as(self, user_id):\n        with self.client.session_transaction() as session:\n            session["active_user_id"] = user_id\n            session["csrf_token"] = "smoke-csrf-token"\n\n    def csrf_headers(self):\n        return {"X-CSRF-Token": "smoke-csrf-token"}\n\n    def create_test_inventory(self, inventory_no):\n        factory = Factory(name=f"{inventory_no} Factory")\n        hardware_type = HardwareType(name=f"{inventory_no} Type")\n        brand = Brand(name=f"{inventory_no} Brand")\n        db.session.add_all([factory, hardware_type, brand])\n        db.session.flush()\n        model = HardwareModel(name=f"{inventory_no} Model", brand_id=brand.id)\n        db.session.add(model)\n        db.session.flush()\n        item = InventoryItem(inventory_no=inventory_no, status="aktif", factory_id=factory.id, department="IT", hardware_type_id=hardware_type.id, brand_id=brand.id, model_id=model.id)\n        db.session.add(item)\n        db.session.flush()\n        return item\n''')
          s = s.replace('''            computer_type = HardwareType.query.filter(HardwareType.name.ilike("%laptop%")).first()\n            self.assertIsNotNone(computer_type)\n            item = InventoryItem.query.filter_by(hardware_type_id=computer_type.id).first()\n            self.assertIsNotNone(item)\n            item.status = "aktif"\n            db.session.add(\n                InventoryMaintenance(\n                    item_id=item.id,\n                    performed_at=datetime.utcnow() - timedelta(days=100),\n                    performed_by="Test Dashboard",\n                    note="Dashboard sınırı için test bakımı",\n                )\n            )''', '''            item = self.create_test_inventory("DASH-SMOKE-001")\n            db.session.add(InventoryMaintenance(item_id=item.id, performed_at=datetime.utcnow() - timedelta(days=100), performed_by="Test Dashboard", note="Dashboard sınırı için test bakımı"))''')
          s = s.replace('self.assertIn("Bakım Zamanı Gelenler", html)', 'self.assertIn("BAKIM BEKLEYENLER", html)')
          s = s.replace('''        with self.app.app_context():\n            computer_type = HardwareType.query.filter(HardwareType.name.ilike("%laptop%")).first()\n            item = InventoryItem.query.filter_by(hardware_type_id=computer_type.id).first()\n            item_id = item.id''', '''        with self.app.app_context():\n            item = self.create_test_inventory("MAINT-SMOKE-001")\n            item_id = item.id''')
          s = s.replace('''                "note": "Fan temizliği ve termal bakım yapıldı.",\n            },\n        )''', '''                "note": "Fan temizliği ve termal bakım yapıldı.",\n            },\n            headers=self.csrf_headers(),\n        )''')
          p.write_text(s)
          Path('.github/workflows/patch-smoke-test.yml').unlink()
          if 'self.create_test_inventory("DASH-SMOKE-001")' not in s:
              raise SystemExit('smoke dashboard patch did not apply')
          if 'headers=self.csrf_headers()' not in s:
              raise SystemExit('csrf patch did not apply')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_smoke_routes.py .github/workflows/patch-smoke-test.yml
          git commit -m 'test: isolate smoke inventory records'
          git push
