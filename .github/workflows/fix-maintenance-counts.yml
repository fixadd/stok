name: Fix Maintenance Counts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dashboard count implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, subprocess

          p = Path('app/legacy.py')
          source = p.read_text(encoding='utf-8')
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'load_maintenance_dashboard_counts']
          if len(nodes) != 1:
              raise SystemExit(f'Expected one load_maintenance_dashboard_counts, found {len(nodes)}')
          n = nodes[0]
          replacement = '''def load_maintenance_dashboard_counts() -> dict[str, int]:\n    due_count = 0\n    warning_count = 0\n\n    latest_by_item: dict[int, InventoryMaintenance] = {}\n    maintenance_records = InventoryMaintenance.query.order_by(\n        InventoryMaintenance.item_id, InventoryMaintenance.performed_at.desc()\n    ).all()\n    for record in maintenance_records:\n        latest_by_item.setdefault(record.item_id, record)\n\n    items = InventoryItem.query.options(joinedload(InventoryItem.hardware_type)).all()\n    for item in items:\n        if not is_computer_hardware_type(\n            item.hardware_type.name if item.hardware_type else None\n        ):\n            continue\n        if (item.status or "").lower() in {"hurda", "stokta"}:\n            continue\n\n        last_maintenance = latest_by_item.get(item.id)\n        maintenance_status = calculate_maintenance_status(\n            last_maintenance.performed_at if last_maintenance else None\n        )["status"]\n        if maintenance_status in {"overdue", "none"}:\n            due_count += 1\n        elif maintenance_status == "warning":\n            warning_count += 1\n\n    return {\n        "maintenance_due_count": due_count,\n        "maintenance_warning_count": warning_count,\n    }\n'''
          lines[n.lineno-1:n.end_lineno] = [replacement]
          p.write_text(''.join(lines), encoding='utf-8')

          Path('.github/workflows/fix-maintenance-counts.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','fix: calculate maintenance dashboard counts from latest records'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
